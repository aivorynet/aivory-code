<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile · Voice task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.body > *{flex-shrink:0}
.phn *{box-sizing:border-box}
:where(.phn) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.phn{width:390px;height:844px;position:relative;overflow:hidden;background:#F6F7F9;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;color:#1A1A2E;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.rbw{flex:none;height:3px;background:linear-gradient(90deg,#F59E0B 0%,#F97316 15%,#EF4444 30%,#7C3AED 50%,#6B8AFF 65%,#51B5BF 80%,#059669 100%)}
.bar{flex:none;display:flex;align-items:center;padding:14px 12px 0 20px}
.bar b{font-size:13px;font-weight:600;color:#5A6578}
.x{margin-left:auto;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:#1A1A2E!important;text-decoration:none}
.body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.body::-webkit-scrollbar{display:none}
h1{margin:0 4px;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tr{background:#FFFFFF;border-radius:16px;padding:16px;font-size:17px;line-height:1.5;box-shadow:0 1px 2px rgba(13,13,14,.04),0 8px 24px rgba(13,13,14,.06);min-height:110px}
.tr .live{color:#8A93A6}
.tr .k{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5A6578;margin-bottom:6px}
.prop{background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(13,13,14,.04),0 8px 24px rgba(13,13,14,.06);overflow:hidden}
.pr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid rgba(13,13,14,.06);min-height:56px;width:100%;text-align:left}
.pr:first-child{border-top:0}
.pr .l{font-size:12.5px;color:#5A6578;width:84px;flex:none}
.pr .v{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pr .v b{font-size:14.5px;font-weight:600}
.pr .v span{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#5A6578;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .ch{color:#8A93A6}
.steps{display:flex;gap:4px;margin-top:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:#E6E9EE}
.pdot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.when{display:flex;gap:2px;padding:3px;background:#ECEEF2;border-radius:10px}
.wb{flex:1;height:40px;border-radius:8px;font-size:13.5px;color:#4A5568!important}
.wb.on{background:#FFFFFF!important;color:#1A1A2E!important;font-weight:600;box-shadow:0 1px 2px rgba(13,13,14,.08)}
.hold{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px 30px;background:#FFFFFF;border-top:1px solid rgba(13,13,14,.08)}
.wave{display:flex;align-items:center;gap:4px;height:34px}
.wave i{width:4px;border-radius:2px;background:#C9CED8;display:block}
.wave.on i{background:#DC2626}
.micb{width:84px;height:84px;border-radius:999px;display:grid;place-items:center;background:#1A1A2E!important;color:#FFFFFF!important;box-shadow:0 10px 28px rgba(13,13,14,.25)}
.micb.on{background:#DC2626!important;box-shadow:0 0 0 10px rgba(220,38,38,.15),0 10px 28px rgba(220,38,38,.35)}
.hold .h{font-size:13px;color:#5A6578}
.go{width:100%;height:52px;border-radius:14px;background:#3574F0!important;color:#FFFFFF!important;font-size:15px;font-weight:600}
.go:disabled{background:#C9CED8!important}
.toast{position:absolute;left:16px;right:16px;bottom:200px;padding:14px 16px;border-radius:14px;background:#1A1A2E;color:#FFFFFF;font-size:14px;display:flex;gap:10px;z-index:4}
.toast a{margin-left:auto;color:#A9B6FF;text-decoration:none;font-weight:500}
</style>
</helmet>
<div class="phn">
<div class="rbw" aria-hidden="true"></div>
<div class="bar"><b>New task by voice</b><a class="x" href="Focus.dc.html" aria-label="Close"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path></svg></a></div>
<div class="body">
<h1>{{title}}</h1>
<div class="tr"><span class="k">{{trLabel}}</span>{{said}}<span class="live">{{tail}}</span></div>
<sc-if value="{{hasProp}}" hint-placeholder-val="{{true}}">
<div class="prop">
<button class="pr"><span class="l">Repo · part</span><span class="v"><b>aivory-guard / api</b><span>guard/api/** · 2 live sessions</span></span><span class="ch">›</span></button>
<button class="pr"><span class="l">Playbook</span><span class="v"><b>feature · 5 steps</b><span>plan → implement → test → review → merge</span><span class="steps"><i></i><i></i><i></i><i></i><i></i></span></span><span class="ch">›</span></button>
<button class="pr"><span class="l">Agent</span><span class="v"><b><i class="pdot" style="background: #D97757"></i>claude · opus-5.5</b><span>high effort · Edit mode · 1 test-writer subagent</span></span><span class="ch">›</span></button>
<button class="pr"><span class="l">Gates</span><span class="v"><b>tests · Guard · your review</b><span>from the repo defaults</span></span><span class="ch">›</span></button>
</div>
<div class="when" role="group" aria-label="When to start"><sc-for list="{{whens}}" as="w"><button class="wb {{w.on}}" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}">{{w.t}}</button></sc-for></div>
</sc-if>
</div>
<div class="hold">
<div class="wave {{waveCls}}" aria-hidden="true"><sc-for list="{{wave}}" as="h"><i style="height: {{h}}px"></i></sc-for></div>
<button class="micb {{micCls}}" aria-label="Hold to speak" aria-pressed="{{micPressed}}" onClick="{{toggle}}"><svg width="34" height="34" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="5.75" y="1.5" width="4.5" height="8" rx="2.25"></rect><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"></path></svg></button>
<span class="h">{{holdHint}}</span>
<button class="go" disabled="{{noGo}}" onClick="{{start}}">{{goText}}</button>
</div>
<sc-if value="{{started}}" hint-placeholder-val="{{false}}"><div class="toast">Task queued in aivory-guard.<a href="Sessions.dc.html">Sessions</a></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SAID = 'Add rate limits per organisation to the guard api, with RateLimit headers and a 429 body. ';
const TAIL = 'Write tests for the reset window…';
const WAVE = [6, 12, 20, 14, 26, 18, 30, 16, 24, 10, 22, 28, 14, 20, 8, 16, 24, 12, 6];

class Component extends DCLogic {
  state = { rec: true, when: 'Start now', started: false };

  renderVals() {
    const st = this.state;
    return {
      title: st.rec ? 'Listening…' : 'Check the task',
      trLabel: st.rec ? 'Transcript · live' : 'Transcript',
      said: SAID, tail: st.rec ? TAIL : 'Write tests for the reset window.',
      hasProp: true,
      whens: ['Start now', 'Queue it', 'Plan only'].map(t => ({ t, on: st.when === t ? 'on' : '', pressed: st.when === t ? 'true' : 'false', pick: () => this.setState({ when: t }) })),
      wave: WAVE.map(h => st.rec ? h : 4), waveCls: st.rec ? 'on' : '',
      micCls: st.rec ? 'on' : '', micPressed: st.rec ? 'true' : 'false', toggle: () => this.setState({ rec: !this.state.rec }),
      holdHint: st.rec ? 'Release to stop' : 'Hold to add more',
      noGo: st.rec, goText: st.rec ? 'Speak, then release' : st.when === 'Plan only' ? 'Make the plan' : st.when === 'Queue it' ? 'Queue the task' : 'Start the task',
      started: st.started, start: () => this.setState({ started: true })
    };
  }
}
</script>
</body>
</html>
