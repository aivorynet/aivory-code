[package]
name = "aivory-vcs"
description = "AIVory Code version control: Vcs trait, git backend, turn ledger, turn snapshots, blame by prompt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# MIT. `bundled` compiles SQLite (public domain); same version as `aivory-engine`, so one SQLite links.
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror.workspace = true
# MIT or Apache-2.0. Holds the temporary index file of a snapshot.
tempfile = "3"

[lints]
workspace = true
