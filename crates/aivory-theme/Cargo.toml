[package]
name = "aivory-theme"
description = "AIVory theme packages (ADR 0024): parse, validate and unpack a theme. No network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aivory-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# MIT or Apache-2.0.
sha2 = "0.10"
# Apache-2.0 or MIT. Reads the font tables for the checks.
ttf-parser = "0.25"
# MIT. Version 9 or newer (RUSTSEC-2026-0367, -0368, -0369, -0429). Inflate only, no crypto.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
