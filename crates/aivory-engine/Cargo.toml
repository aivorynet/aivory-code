[package]
name = "aivory-engine"
description = "AIVory Code daemon engine: local SQLite store, activity sampler, usage estimate, autopilot planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aivory-protocol.workspace = true
# MIT. `bundled` compiles SQLite (public domain) into the binary.
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
