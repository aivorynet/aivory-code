# cargo-deny configuration. Run: cargo deny check
[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# webpki-roots (Mozilla CA list as data, needed by iroh-relay TLS) uses a permissive data
# license. Allowed for this crate only; review with the owner.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # cbindgen is a macOS build-time header generator of gpui-pre-apple; no code of it
    # links into the app. Review with the owner.
    { allow = ["MPL-2.0"], crate = "cbindgen" },
    # hexf-parse (float literal parser of naga, wgpu on Linux) is public domain (CC0-1.0).
    { allow = ["CC0-1.0"], crate = "hexf-parse" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version (all crates are publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# Report unmaintained crates only when a workspace crate uses them directly; the rest come
# from GPUI and iroh.
unmaintained = "workspace"
ignore = [
    # zip 2.6.1 comes only from the build script of sherpa-onnx-sys. These advisories are about
    # ZipArchive::extract on untrusted archives. Theme archives use zip 9 and a custom unpacker.
    { id = "RUSTSEC-2026-0367", reason = "build dependency of sherpa-onnx-sys only" },
    { id = "RUSTSEC-2026-0368", reason = "build dependency of sherpa-onnx-sys only" },
    { id = "RUSTSEC-2026-0369", reason = "build dependency of sherpa-onnx-sys only" },
    { id = "RUSTSEC-2026-0429", reason = "build dependency of sherpa-onnx-sys only" },
    # ttf-parser: the desktop app reads the bundled Plex outlines for rotated labels (vtext.rs);
    # GPUI (rustybuzz) uses the same crate. No vulnerability, only "unmaintained".
    { id = "RUSTSEC-2026-0192", reason = "font outlines of bundled fonts only; also used by GPUI" },
]
