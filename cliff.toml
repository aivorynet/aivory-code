# git-cliff configuration (docs/design/15-release.md).
# release-plz reads this file (release-plz.toml: changelog_config) to write CHANGELOG.md.
# CI runs `git cliff --latest --strip header` to write the notes of a GitLab release.
# Commit messages follow Conventional Commits: feat, fix, perf, refactor, docs, ...

[changelog]
header = """
# Changelog

All notable changes to AIVory Code are in this file. It is generated from the commit messages.

"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} (breaking){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Release tags only. The dry-run tag vX.Y.Z-dry does not match.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
commit_parsers = [
    { message = '^chore\(release\)', skip = true },
    { message = '^chore\(deps', skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^(build|ci)", group = "Build and release" },
    { message = "^(test|style|chore)", skip = true },
]
